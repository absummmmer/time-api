version: '3.8'

services:
  time-api:
    build: .
    container_name: time-api
    restart: unless-stopped
    ports:
      # Host port is configurable; default 8080.
      - "8088:8080"
    volumes:
      # Last-good DUT1 data survives container restarts/recreates.
      - dut1-cache:/data/dut1
    environment:
      - TZ=UTC
      # Upstream EOP source. Supports a comma-separated fallback list.
      - DUT1_SOURCE_URL=https://datacenter.iers.org/data/latestVersion/bulletinA.txt
      # Baseline stale-age and fallback refresh interval; normal checks are publication-aware.
      - DUT1_REFRESH_INTERVAL=6h
      - DUT1_HTTP_TIMEOUT=30s
      - DUT1_STALE_AFTER=12h
      # Publication-aware checks: IERS Bulletin A is expected weekly on
      # Thursday around 17:40 UTC; NTSC's daily EOP file around 15:30 +08.
      # If the expected file is late, retry at the first interval and double
      # it up to the maximum, then align again to the next publication window.
      - DUT1_IERS_PUBLICATION_WEEKDAY=4
      - DUT1_IERS_PUBLICATION_TIME=17:40
      - DUT1_IERS_FOLLOWUP_RETRY=15m
      - DUT1_IERS_FOLLOWUP_MAX=6h
      - DUT1_NTSC_PUBLICATION_TIME=15:30
      - DUT1_NTSC_FOLLOWUP_RETRY=10m
      - DUT1_NTSC_FOLLOWUP_MAX=2h
      # Persistent last-good snapshot used when upstreams are unreachable.
      - DUT1_CACHE_DIR=/data/dut1
      # Prefer the official IERS host; if it is unreachable, use NTSC's mirror
      # of the same IERS Bulletin A files. When the mirror publication is
      # stale, retries use the same publication-aware backoff.
      - DUT1_IERS_MIRROR_ENABLED=true
      - DUT1_IERS_MIRROR_REFRESH_INTERVAL=24h
      - DUT1_IERS_MIRROR_RETRY_INTERVAL=15m
      # Independent NTSC EOP peer source (not an IERS backup). Refreshed daily;
      # the large EOP file is only downloaded when its file ID changes.
      - DUT1_NTSC_ENABLED=true
      - DUT1_NTSC_REFRESH_INTERVAL=24h
      - DUT1_NTSC_RETRY_INTERVAL=1h
      - DUT1_NTSC_STALE_AFTER=48h
      - DUT1_DEFAULT_SOURCE=auto
      # Observe the upstream NTP source from inside the container. The monitor
      # itself never changes the host/container clock; /v1/time/ntp may apply a
      # bounded correction to the timestamps it serves.
      - NTP_MONITOR_ENABLED=true
      # Priority order, comma-separated. NTSC stays first; the rest are
      # fallback/health sources when the primary path is unusable.
      - NTP_MONITOR_SERVERS=ntp.aliyun.com,ntp.tencent.com,cn.pool.ntp.org,ntp.ntsc.ac.cn,pool.ntp.org,time.nist.gov,time.windows.com,time.apple.com
      - NTP_MONITOR_INTERVAL=5m
      - NTP_MONITOR_TIMEOUT=3s
      - NTP_MONITOR_HOLDOVER_AFTER=20m
      - NTP_MONITOR_MAX_OFFSET_MS=10
      - NTP_MONITOR_MAX_UNCERTAINTY_MS=20
      # Apply host-time correction when the NTP sample is fresh and uncertainty
      # is <= 20ms. `first` means only the first configured source, while
      # synchronized and non-fallback, may correct; fallback sources are
      # observation-only. Set to `off` for monitor-only operation.
      - NTP_CORRECTION_MODE=first
      - NTP_CORRECTION_MAX_UNCERTAINTY_MS=20
      - NTP_CORRECTION_MAX_AGE=10m
      - NTP_CORRECTION_DRIFT_MS_PER_HOUR=0

volumes:
  dut1-cache:
